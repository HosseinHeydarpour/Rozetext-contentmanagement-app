name: instagram_content_manager
description: "Android Content Management App for Instagram with Local PC Sync"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Network & API
  http: ^1.2.1

  # Local Persistence
  shared_preferences: ^2.2.3

  # Media Player & Video
  video_player: ^2.8.6
  chewie: ^1.8.1

  # QR Code Scanner for Local IP connection
  mobile_scanner: ^5.1.1

  # Saving Media to Device Gallery & Storage
  gal: ^2.3.0
  path_provider: ^2.1.3

  # Scheduled Reminders & Notifications
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.3

  # Persian / Jalali Calendar Support
  shamsi_date: ^1.0.1

  # UI / UX Utilities
  cached_network_image: ^3.3.1
  flutter_staggered_grid_view: ^0.7.0
  intl: 0.20.3
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
